
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Sugirvas Senthilkumar — Software Engineering and Cybersecurity">
<title>Sugirvas Senthilkumar</title>

<script>
document.documentElement.classList.add("js");
</script>

<style>
:root {
  color-scheme: dark;
  --black: #000;
  --white: #f2f2f2;
  --gray: #8a8a8a;
  --mono: "SFMono-Regular", Menlo, Monaco,
    Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--black);
  color: var(--white);
}

body { font-family: var(--mono); }

#portfolio {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
  font-family: system-ui, sans-serif;
}

#portfolio h1 {
  margin: 0;
  font-size: clamp(2rem, 6vw, 4rem);
  letter-spacing: -.04em;
}

#portfolio p {
  color: #aaa;
  font-size: .76rem;
  letter-spacing: .17em;
  line-height: 1.8;
}

.js #portfolio {
  visibility: hidden;
}

.js #portfolio.unlocked {
  visibility: visible;
  animation: reveal .65s ease both;
}

#boot {
  display: none;
}

.js #boot {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  background: #000;
  overflow: hidden;
  transition: opacity .55s ease;
}

.js #boot.exit {
  opacity: 0;
  pointer-events: none;
}

.console {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: clamp(18px, 3vw, 48px);
  font-size: clamp(11px, 1.15vw, 14px);
  line-height: 1.72;
  scrollbar-width: thin;
  scrollbar-color: #333 #000;
}

#output {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

.line {
  min-height: 1.72em;
}

.dim { color: var(--gray); }
.bright { color: #fff; }
.ok { color: #e0e0e0; }

.prompt {
  display: none;
  margin-top: 1.5em;
}

.prompt.ready { display: block; }

.command {
  color: #fff;
  margin-bottom: 1em;
}

.enter {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0;
  color: #fff;
  background: transparent;
  border: 0;
  font: inherit;
  text-align: left;
  cursor: pointer;
  line-height: 1.8;
}

.enter:focus-visible {
  outline: 1px solid white;
  outline-offset: 5px;
}

.cursor {
  display: inline-block;
  width: .65em;
  height: 1.12em;
  background: #fff;
  vertical-align: -.19em;
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

@keyframes reveal {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 600px) {
  .console {
    padding: 20px 15px;
    font-size: 11px;
    line-height: 1.65;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<section id="boot" aria-label="Terminal initialization">
  <div class="console" id="console">
    <div id="output" aria-hidden="true"></div>

    <div class="prompt" id="prompt">
      <div class="command">
        root@sugirvas:~# ./enter_portfolio
      </div>
      <button class="enter" id="enter" type="button">
        <span>Press ENTER to access portfolio</span>
        <span class="cursor" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</section>

<main id="portfolio">
  <div>
    <h1>SUGIRVAS SENTHILKUMAR</h1>
    <p>SOFTWARE DEVELOPMENT / CYBERSECURITY</p>
  </div>
</main>

<script>
(() => {
  "use strict";

  const boot = document.getElementById("boot");
  const output = document.getElementById("output");
  const consoleView = document.getElementById("console");
  const prompt = document.getElementById("prompt");
  const enter = document.getElementById("enter");
  const portfolio = document.getElementById("portfolio");

  const reducedMotion = matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  let completed = false;
  let unlocked = false;
  let time = 0;

  // Fictional boot telemetry for visual presentation.
  // No real kernel or security tests are performed.
  const sequence = [
    ["SUGIRVAS SYSTEM CONSOLE", "bright", 500],
    ["BOOTLOADER / OPERATOR ENVIRONMENT", "dim", 450],
    ["", "", 400],

    ["Initializing system runtime...", "", 650],
    ["Detecting system architecture...", "", 550],
    ["Architecture: x86_64 / simulated", "dim", 450],
    ["Loading initialization modules...", "", 700],
    ["Memory subsystem initialized", "ok", 450],
    ["Allocating interface memory...", "", 550],
    ["Runtime memory allocation complete", "ok", 450],
    ["", "", 400],

    ["[ CORE ] Initializing system services", "bright", 600],
    ["[  OK  ] Runtime environment loaded", "ok", 500],
    ["[  OK  ] Interface components registered", "ok", 550],
    ["[  OK  ] Resource mappings initialized", "ok", 500],
    ["[  OK  ] Local execution context ready", "ok", 600],
    ["", "", 500],

    ["[ SEC  ] Loading security interface", "bright", 650],
    ["[  OK  ] Security module definitions loaded", "ok", 550],
    ["[  OK  ] Configuration registry parsed", "ok", 550],
    ["[  OK  ] Local interface policy initialized", "ok", 550],
    ["[  OK  ] Integrity simulation complete", "ok", 650],
    ["", "", 500],

    ["[ ID   ] Resolving operator identity", "bright", 750],
    ["Identity identifier: 0x5355474952564153", "dim", 550],
    ["Operator: SUGIRVAS SENTHILKUMAR", "bright", 650],
    ["Domain: SOFTWARE ENGINEERING", "", 500],
    ["Specialization: CYBERSECURITY", "", 550],
    ["Identity context registered", "ok", 650],
    ["", "", 500],

    ["[ SYS  ] Mounting portfolio environment", "bright", 700],
    ["Loading project registry...", "", 550],
    ["Registering CYBER FEED...", "", 450],
    ["Registering SUGISOC...", "", 450],
    ["Registering SUGISCOPE...", "", 450],
    ["Preparing presentation layer...", "", 650],
    ["[  OK  ] Interface components available", "ok", 650],
    ["", "", 400],

    ["[ FINAL ] Running startup diagnostics", "bright", 700],
    ["Checking display configuration...", "", 500],
    ["Monochrome display profile: ACTIVE", "ok", 550],
    ["Loading interaction handlers...", "", 600],
    ["Preparing terminal handoff...", "", 750],
    ["[  OK  ] Initialization complete", "ok", 650],
    ["", "", 500],
    ["SYSTEM READY.", "bright", 800],
    ["", "", 300]
  ];

  const delay = (ms) =>
    new Promise(resolve => setTimeout(resolve, ms));

  function scrollBottom() {
    consoleView.scrollTop = consoleView.scrollHeight;
  }

  function addLine(message, style) {
    const line = document.createElement("div");
    line.className = "line";

    if (style) line.classList.add(style);

    if (message === "") {
      line.textContent = "\u00a0";
    } else {
      const stamp = (time / 1000).toFixed(6)
        .padStart(11, " ");

      line.textContent = `[${stamp}] ${message}`;
    }

    output.appendChild(line);
    scrollBottom();
  }

  async function runBoot() {
    for (const [message, style, duration] of sequence) {
      addLine(message, style);

      time += duration;
      await delay(duration);
    }

    completed = true;
    prompt.classList.add("ready");
    scrollBottom();
    enter.focus({ preventScroll: true });
  }

  function openPortfolio() {
    if (!completed || unlocked) return;

    unlocked = true;

    portfolio.classList.add("unlocked");
    boot.classList.add("exit");

    const removeDelay = reducedMotion ? 0 : 600;

    setTimeout(() => {
      boot.remove();
      document.getElementById("portfolio")
        .setAttribute("tabindex", "-1");
      portfolio.focus({ preventScroll: true });
    }, removeDelay);
  }

  enter.addEventListener("click", openPortfolio);

  document.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && completed && !unlocked) {
      event.preventDefault();
      openPortfolio();
    }
  });

  runBoot();
})();
</script>

</body>
</html>

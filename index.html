<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Portfolio of Sugirvas Senthilkumar — Software Engineering and Cybersecurity.">
  <title>Sugirvas Senthilkumar — Portfolio</title>

  <script>
    document.documentElement.classList.add("js");
  </script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --panel: #050505;
      --border: #1b1b1b;
      --text: #f5f5f5;
      --muted: #8c8c8c;
      --soft: #2b2b2b;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      overflow: hidden;
      font-family: "SFMono-Regular", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    /* HERO */
    #hero {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: #000;
      color: #fff;
      opacity: 0;
      transition: opacity 900ms ease;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #hero.show {
      opacity: 1;
    }

    .hero-wrap h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
      font-weight: 600;
    }

    .hero-wrap p {
      margin: 14px 0 0;
      color: #9d9d9d;
      font-size: 0.76rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* TERMINAL BOOT */
    #boot {
      position: fixed;
      inset: 0;
      background: #000;
      display: grid;
      place-items: center;
      padding: 24px;
      z-index: 999;
      opacity: 1;
      transition: opacity 700ms ease, visibility 700ms ease;
    }

    #boot.finished {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .terminal {
      width: min(1100px, 100%);
      height: min(680px, calc(100svh - 48px));
      background: var(--panel);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .terminal-top {
      height: 42px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      flex-shrink: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5f5f5f;
      opacity: 0.85;
    }

    .terminal-title {
      margin-left: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .terminal-body {
      flex: 1;
      padding: 18px 18px 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.02), rgba(255,255,255,0));
    }

    .terminal-screen {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.75;
      font-size: clamp(12px, 1.45vw, 15px);
      color: var(--text);
      min-height: 100%;
    }

    .line {
      display: block;
    }

    .dim {
      color: var(--muted);
    }

    .ok {
      color: #ffffff;
    }

    .cursor {
      display: inline-block;
      width: 0.62em;
      height: 1.1em;
      background: #fff;
      vertical-align: -0.18em;
      margin-left: 2px;
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (max-width: 640px) {
      #boot {
        padding: 12px;
      }

      .terminal {
        height: calc(100svh - 24px);
      }

      .terminal-top {
        height: 40px;
      }

      .terminal-body {
        padding: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <section id="boot" aria-label="Boot sequence">
    <div class="terminal" role="img" aria-label="Terminal boot sequence">
      <div class="terminal-top">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="terminal-title">sugirvas@system:~ / secure-init</span>
      </div>
      <div class="terminal-body">
        <div id="terminalScreen" class="terminal-screen"></div>
      </div>
    </div>
  </section>

  <main id="hero" aria-label="Homepage">
    <div class="hero-wrap">
      <h1>SUGIRVAS SENTHILKUMAR</h1>
      <p>SOFTWARE DEVELOPMENT / CYBERSECURITY</p>
    </div>
  </main>

  <script>
    (() => {
      const boot = document.getElementById("boot");
      const hero = document.getElementById("hero");
      const screen = document.getElementById("terminalScreen");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const lines = [
        "> boot sequence initiated",
        "> loading secure runtime modules",
        "[ok] runtime modules loaded",
        "",
        "> mounting operator environment",
        "[ok] environment mounted",
        "",
        "> resolving identity registry",
        "[ok] identity resolved :: SUGIRVAS SENTHILKUMAR",
        "",
        "> decrypting portfolio interface",
        "[ok] interface decrypted",
        "",
        "> loading communication layers",
        "[ok] communication layers active",
        "",
        "> verifying system integrity",
        "[ok] integrity check complete",
        "",
        "> establishing session",
        "[ok] session established",
        "",
        "> access level: authorized",
        "> status: system ready",
        "",
        "> launching portfolio..."
      ];

      let currentLine = 0;
      let isFinished = false;

      const charDelay = reducedMotion ? 0 : 18;
      const lineDelay = reducedMotion ? 60 : 180;
      const finalDelay = reducedMotion ? 180 : 850;

      function renderCursor() {
        if (isFinished) return;
        const oldCursor = screen.querySelector(".cursor");
        if (oldCursor) oldCursor.remove();

        const cursor = document.createElement("span");
        cursor.className = "cursor";
        screen.appendChild(cursor);
      }

      function appendLine(text = "") {
        const line = document.createElement("span");
        line.className = "line";
        screen.appendChild(line);
        return line;
      }

      function typeText(element, text, index = 0) {
        return new Promise((resolve) => {
          if (charDelay === 0) {
            element.textContent = text;
            resolve();
            return;
          }

          function step() {
            element.textContent += text.charAt(index);
            index += 1;

            if (index < text.length) {
              setTimeout(step, charDelay);
            } else {
              resolve();
            }
          }

          step();
        });
      }

      async function runBoot() {
        for (currentLine = 0; currentLine < lines.length; currentLine++) {
          const content = lines[currentLine];
          const lineEl = appendLine("");

          renderCursor();

          await typeText(lineEl, content);

          renderCursor();

          await new Promise((resolve) =>
            setTimeout(resolve, content === "" ? 45 : lineDelay)
          );
        }

        isFinished = true;

        const cursor = screen.querySelector(".cursor");
        if (cursor) cursor.remove();

        await new Promise((resolve) => setTimeout(resolve, finalDelay));

        boot.classList.add("finished");
        hero.classList.add("show");

        setTimeout(() => {
          boot.remove();
          document.body.style.overflow = "";
        }, reducedMotion ? 0 : 800);
      }

      runBoot();
    })();
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Portfolio of Sugirvas Senthilkumar">
<title>Sugirvas Senthilkumar</title>
<script>document.documentElement.classList.add("js");</script>
<style>
:root {
  color-scheme: dark;
  --fg: #f2f2f2;
  --mono: "SFMono-Regular", Menlo, Monaco,
          Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: #000;
  color: var(--fg);
}
body { font-family: var(--mono); }

#portfolio {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
  font-family: system-ui, sans-serif;
}
#portfolio h1 {
  margin: 0;
  font-size: clamp(2rem, 6vw, 4rem);
  letter-spacing: -.04em;
  line-height: 1.1;
}
#portfolio p {
  color: #aaa;
  font-size: .76rem;
  letter-spacing: .17em;
  line-height: 1.8;
}
.js #portfolio { visibility: hidden; }
.js #portfolio.unlocked {
  visibility: visible;
  animation: reveal .45s ease both;
}

.terminal-stage { display: none; }
.js .terminal-stage {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  background: #000;
  overflow: hidden;
  transition: opacity .4s ease;
}
.js .terminal-stage.exit {
  opacity: 0;
  pointer-events: none;
}
.js #login-stage {
  z-index: 101;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
}
.js #login-stage.active {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}
.console {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: clamp(24px, 4vw, 60px);
  scrollbar-width: thin;
  scrollbar-color: #333 #000;
}
.console-content {
  width: 100%;
  max-width: 1100px;
}
#output, #login-output, .prompt, .ascii-progress {
  font-size: clamp(12px, 1.1vw, 15px);
  line-height: 1.9;
  font-variant-numeric: tabular-nums;
}
#output, #login-output {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.line, .login-line { min-height: 1.9em; }
.bright { color: #fff; }
.separator { color: #555; }
.login-prefix, .command-prefix { color: #999; }

.ascii-progress {
  margin-top: 22px;
  color: #ddd;
  white-space: pre;
  overflow-x: auto;
}
.prompt {
  display: none;
  margin-top: 24px;
}
.prompt.ready { display: block; }
.command { margin-bottom: 8px; }

.enter {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  background: transparent;
  border: 0;
  color: #fff;
  cursor: pointer;
  text-align: left;
  font: inherit;
}
.enter:focus-visible {
  outline: 1px solid white;
  outline-offset: 5px;
}
.cursor {
  display: inline-block;
  width: .65em;
  height: 1.05em;
  background: white;
  vertical-align: -.16em;
  margin-left: 3px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
@keyframes reveal {
  from { opacity: 0; }
  to { opacity: 1; }
}
@media (max-width: 600px) {
  .console { padding: 24px 16px; }
  #output, #login-output, .prompt, .ascii-progress {
    font-size: 11px;
    line-height: 1.75;
  }
  .line, .login-line { min-height: 1.75em; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<section id="boot-stage" class="terminal-stage"
         aria-label="Secure boot introduction">
  <div class="console" id="boot-console">
    <div class="console-content">
      <div id="output" aria-hidden="true"></div>
      <div class="ascii-progress"
           id="ascii-progress"
           role="progressbar"
           aria-label="Boot progress"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-valuenow="0">BOOT  [--------------------] 000%</div>
      <div class="prompt" id="prompt">
        <div class="command">
          <span class="command-prefix">system@localhost:~$</span> ./launch
        </div>
        <button class="enter" id="enter" type="button">
          Press ENTER to continue
          <span class="cursor" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
</section>

<section id="login-stage" class="terminal-stage"
         aria-label="Automated terminal login"
         aria-hidden="true">
  <div class="console" id="login-console">
    <div class="console-content">
      <div id="login-output" aria-hidden="true"></div>
    </div>
  </div>
</section>

<main id="portfolio">
  <div>
    <h1>SUGIRVAS SENTHILKUMAR</h1>
    <p>SOFTWARE DEVELOPMENT / CYBERSECURITY</p>
  </div>
</main>

<script>
(() => {
  "use strict";

  const boot = document.getElementById("boot-stage");
  const bootConsole = document.getElementById("boot-console");
  const output = document.getElementById("output");
  const progress = document.getElementById("ascii-progress");
  const prompt = document.getElementById("prompt");
  const enter = document.getElementById("enter");
  const loginStage = document.getElementById("login-stage");
  const loginConsole = document.getElementById("login-console");
  const loginOutput = document.getElementById("login-output");
  const portfolio = document.getElementById("portfolio");

  const reducedMotion = matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  const BOOT_DURATION = 5000;
  const BAR_WIDTH = 20;
  let bootReady = false;
  let loginStarted = false;

  const delay = ms =>
    new Promise(resolve => setTimeout(resolve, ms));

  // Simulated boot and login, not real authentication.
  const sequence = [
    ["SECURE BOOT", "bright"],
    ["────────────────────────────────────────", "separator"],
    ["", ""],
    ["> initializing execution environment", ""],
    ["> loading core runtime", ""],
    ["> configuring memory subsystem", ""],
    ["> mounting virtual filesystem", ""],
    ["> resolving module dependencies", ""],
    ["> starting system services", ""],
    ["> initializing terminal interface", ""],
    ["> preparing application runtime", ""],
    ["", ""],
    ["[ OK ] SYSTEM READY", "bright"]
  ];

  function scrollBottom(element) {
    element.scrollTop = element.scrollHeight;
  }

  function addBootLine(message, style) {
    const line = document.createElement("div");
    line.className = "line";
    if (style) line.classList.add(style);
    line.textContent = message || "\u00a0";
    output.appendChild(line);
    scrollBottom(bootConsole);
  }

  function updateProgress(value) {
    const n = Math.max(0, Math.min(100, Math.round(value)));
    const filled = Math.round(n / 100 * BAR_WIDTH);
    const bar = "#".repeat(filled) +
                "-".repeat(BAR_WIDTH - filled);
    progress.textContent =
      `BOOT  [${bar}] ${String(n).padStart(3, "0")}%`;
    progress.setAttribute("aria-valuenow", String(n));
  }

  async function runBoot() {
    const start = performance.now();
    const step = BOOT_DURATION / sequence.length;

    for (let i = 0; i < sequence.length; i++) {
      const remaining =
        start + i * step - performance.now();
      if (remaining > 0) await delay(remaining);

      const [message, style] = sequence[i];
      addBootLine(message, style);
      updateProgress((i + 1) / sequence.length * 100);
    }

    const remaining =
      start + BOOT_DURATION - performance.now();
    if (remaining > 0) await delay(remaining);

    updateProgress(100);
    bootReady = true;
    prompt.classList.add("ready");
    scrollBottom(bootConsole);
    enter.focus({ preventScroll: true });
  }

  function createTerminalLine(prefix = "") {
    const line = document.createElement("div");
    line.className = "login-line";

    const label = document.createElement("span");
    label.className = "login-prefix";
    label.textContent = prefix;

    const value = document.createElement("span");
    line.append(label, value);
    loginOutput.appendChild(line);
    scrollBottom(loginConsole);
    return value;
  }

  async function typeInto(element, text, speed) {
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    cursor.setAttribute("aria-hidden", "true");
    element.after(cursor);

    for (const char of text) {
      element.textContent += char;
      scrollBottom(loginConsole);
      await delay(speed);
    }
    cursor.remove();
  }

  async function runLogin() {
    loginStage.setAttribute("aria-hidden", "false");
    loginStage.classList.add("active");
    boot.remove();

    await delay(300);

    // Generic guest account, no personal identity.
    await typeInto(
      createTerminalLine("localhost login: "),
      "guest",
      100
    );

    await delay(250);

    // Fake masked password, not a real credential.
    await typeInto(
      createTerminalLine("Password: "),
      "************",
      75
    );

    await delay(400);
    createTerminalLine("");

    await typeInto(
      createTerminalLine("guest@localhost:~$ "),
      "whoami",
      140
    );

    await delay(500);

    portfolio.classList.add("unlocked");
    loginStage.classList.add("exit");
    await delay(reducedMotion ? 0 : 450);

    loginStage.remove();
    portfolio.setAttribute("tabindex", "-1");
    portfolio.focus({ preventScroll: true });
  }

  function enterConsole() {
    if (!bootReady || loginStarted) return;
    loginStarted = true;
    runLogin();
  }

  enter.addEventListener("click", enterConsole);

  document.addEventListener("keydown", event => {
    if (event.key === "Enter" &&
        bootReady && !loginStarted) {
      event.preventDefault();
      enterConsole();
    }
  });

  runBoot();
})();
</script>
</body>
</html>

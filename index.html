
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Portfolio of Sugirvas Senthilkumar">
<title>Sugirvas Senthilkumar</title>
<script>document.documentElement.classList.add("js");</script>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --fg: #ededed;
  --muted: #898989;
  --mono: "SFMono-Regular", Menlo, Monaco,
          Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
}
body { font-family: var(--mono); }

/* Portfolio */
#portfolio {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
  font-family: system-ui, sans-serif;
}
#portfolio h1 {
  margin: 0;
  font-size: clamp(2rem, 6vw, 4rem);
  letter-spacing: -.04em;
  line-height: 1.1;
}
#portfolio p {
  color: #aaa;
  font-size: .76rem;
  letter-spacing: .17em;
  line-height: 1.8;
}
.js #portfolio { visibility: hidden; }
.js #portfolio.unlocked {
  visibility: visible;
  animation: reveal .5s ease both;
}

/* Full-screen terminal */
#boot { display: none; }
.js #boot {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  background: #000;
  overflow: hidden;
  transition: opacity .45s ease;
}
.js #boot.exit {
  opacity: 0;
  pointer-events: none;
}
.console {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: clamp(24px, 4vw, 60px);
  scrollbar-width: thin;
  scrollbar-color: #333 #000;
}
.console-content {
  width: 100%;
  max-width: 1100px;
}
#output {
  font-size: clamp(11px, 1.05vw, 14px);
  line-height: 1.9;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}
.line { min-height: 1.9em; }
.dim { color: var(--muted); }
.bright { color: #fff; }
.status { color: #dadada; }
.separator { color: #464646; }

.prompt {
  display: none;
  margin-top: 24px;
  font-size: clamp(11px, 1.05vw, 14px);
  line-height: 2;
}
.prompt.ready { display: block; }
.command { margin-bottom: 10px; }
.command-prefix { color: #999; }

.enter {
  display: inline-flex;
  gap: 10px;
  align-items: center;
  padding: 5px 0;
  background: none;
  border: 0;
  color: #fff;
  cursor: pointer;
  text-align: left;
  font: inherit;
  letter-spacing: .025em;
}
.enter:hover { color: #ccc; }
.enter:focus-visible {
  outline: 1px solid #fff;
  outline-offset: 5px;
}
.cursor {
  display: inline-block;
  width: .65em;
  height: 1.05em;
  background: #fff;
  vertical-align: -.16em;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}
@keyframes reveal {
  from { opacity: 0; }
  to { opacity: 1; }
}
@media (max-width: 600px) {
  .console { padding: 24px 16px; }
  #output, .prompt {
    font-size: 11px;
    line-height: 1.7;
  }
  .line { min-height: 1.7em; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<section id="boot" aria-label="Operations console initialization">
  <div class="console" id="console">
    <div class="console-content">
      <div id="output" aria-hidden="true"></div>

      <div class="prompt" id="prompt">
        <div class="command">
          <span class="command-prefix">operator@console:~$</span>
          ./launch
        </div>
        <button id="enter" class="enter" type="button">
          <span>Press ENTER to continue</span>
          <span class="cursor" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
</section>

<main id="portfolio">
  <div>
    <h1>SUGIRVAS SENTHILKUMAR</h1>
    <p>SOFTWARE DEVELOPMENT / CYBERSECURITY</p>
  </div>
</main>

<script>
(() => {
  "use strict";

  const boot = document.getElementById("boot");
  const output = document.getElementById("output");
  const consoleView = document.getElementById("console");
  const prompt = document.getElementById("prompt");
  const enter = document.getElementById("enter");
  const portfolio = document.getElementById("portfolio");

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  let completed = false;
  let unlocked = false;

  // Fictional operations-console initialization.
  // These messages do not represent real security checks.
  const sequence = [
    ["OPERATIONS CONSOLE", "bright", 500],
    ["INITIALIZATION SEQUENCE / LOCAL RUNTIME", "dim", 400],
    ["──────────────────────────────────────", "separator", 300],
    ["", "", 250],

    ["> initializing execution environment", "", 450],
    ["> loading system configuration", "", 400],
    ["> allocating runtime resources", "", 420],
    ["> resolving interface dependencies", "", 400],
    ["> mounting operational workspace", "", 450],
    ["", "", 250],

    ["  [ OK ] execution context initialized", "status", 370],
    ["  [ OK ] runtime dependencies resolved", "status", 370],
    ["  [ OK ] workspace mounted", "status", 380],
    ["", "", 250],

    ["> initializing console subsystem", "", 450],
    ["> establishing local session context", "", 450],
    ["> preparing interaction layer", "", 420],
    ["", "", 250],

    ["  [ OK ] console session initialized", "status", 400],
    ["  [ OK ] display interface available", "status", 400],
    ["  [ OK ] runtime services operational", "status", 450],
    ["", "", 250],

    ["> finalizing system initialization", "", 500],
    ["> releasing application interface", "", 450],
    ["", "", 250],
    ["STATUS ........................ READY", "bright", 500],
    ["──────────────────────────────────────", "separator", 300]
  ];

  const delay = (ms) =>
    new Promise(resolve => setTimeout(resolve, ms));

  function scrollBottom() {
    consoleView.scrollTop = consoleView.scrollHeight;
  }

  function appendLine(message, style) {
    const line = document.createElement("div");
    line.className = "line";

    if (style) line.classList.add(style);
    line.textContent = message || "\u00a0";

    output.appendChild(line);
    scrollBottom();
  }

  async function runBoot() {
    for (const [message, style, duration] of sequence) {
      appendLine(message, style);
      await delay(duration);
    }

    completed = true;
    prompt.classList.add("ready");
    scrollBottom();
    enter.focus({ preventScroll: true });
  }

  function openPortfolio() {
    if (!completed || unlocked) return;

    unlocked = true;
    portfolio.classList.add("unlocked");
    boot.classList.add("exit");

    window.setTimeout(() => {
      boot.remove();
      portfolio.setAttribute("tabindex", "-1");
      portfolio.focus({ preventScroll: true });
    }, reducedMotion ? 0 : 500);
  }

  enter.addEventListener("click", openPortfolio);

  document.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && completed && !unlocked) {
      event.preventDefault();
      openPortfolio();
    }
  });

  runBoot();
})();
</script>
</body>
</html>

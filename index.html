
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Portfolio of Sugirvas Senthilkumar">
<title>Sugirvas Senthilkumar</title>

<script>
  document.documentElement.classList.add("js");
</script>

<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --fg: #f2f2f2;
  --muted: #919191;
  --mono: "SFMono-Regular", Menlo, Monaco,
          Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
}

body { font-family: var(--mono); }

/* MAIN PORTFOLIO */

#portfolio {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
  font-family: system-ui, sans-serif;
}

#portfolio h1 {
  margin: 0;
  font-size: clamp(2rem, 6vw, 4rem);
  letter-spacing: -.04em;
  line-height: 1.1;
}

#portfolio p {
  color: #aaa;
  font-size: .76rem;
  letter-spacing: .17em;
  line-height: 1.8;
}

.js #portfolio { visibility: hidden; }

.js #portfolio.unlocked {
  visibility: visible;
  animation: reveal .5s ease both;
}

/* SHARED FULLSCREEN TERMINAL */

#boot, #identity {
  display: none;
}

.js #boot,
.js #identity {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  background: #000;
  overflow: hidden;
  transition: opacity .45s ease;
}

.js #identity {
  z-index: 101;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
}

.js #identity.active {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}

.js #boot.exit,
.js #identity.exit {
  opacity: 0;
  pointer-events: none;
}

.console {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: clamp(24px, 4vw, 60px);
  scrollbar-width: thin;
  scrollbar-color: #333 #000;
}

.console-content {
  width: 100%;
  max-width: 1100px;
}

#output {
  font-size: clamp(12px, 1.1vw, 15px);
  line-height: 1.9;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

.line { min-height: 1.9em; }
.bright { color: #fff; }
.separator { color: #555; }

.prompt {
  display: none;
  margin-top: 24px;
  font-size: clamp(12px, 1.1vw, 15px);
  line-height: 2;
}

.prompt.ready { display: block; }

.command { margin-bottom: 10px; }
.command-prefix { color: #999; }

.enter {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  background: none;
  border: 0;
  color: #fff;
  cursor: pointer;
  text-align: left;
  font: inherit;
  letter-spacing: .025em;
}

.enter:hover { color: #ccc; }

.enter:focus-visible {
  outline: 1px solid #fff;
  outline-offset: 5px;
}

.cursor {
  display: inline-block;
  width: .65em;
  height: 1.05em;
  background: #fff;
  vertical-align: -.16em;
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

@keyframes reveal {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* IDENTITY TERMINAL */

.identity-content {
  font-size: clamp(13px, 1.25vw, 17px);
  line-height: 1.9;
}

.identity-command {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0;
  min-height: 2em;
}

#typed-command {
  color: #fff;
  white-space: pre;
}

.identity-result {
  margin-top: 24px;
  display: none;
  opacity: 0;
  transition: opacity .55s ease;
}

.identity-result.visible {
  display: block;
  opacity: 1;
}

.identity-name {
  color: #fff;
  font-size: clamp(23px, 3.5vw, 46px);
  font-weight: 600;
  letter-spacing: -.045em;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.identity-tamil {
  color: #bdbdbd;
  font-family: -apple-system, "Noto Sans Tamil",
               "Tamil Sangam MN", sans-serif;
  font-size: clamp(16px, 2vw, 25px);
  margin-top: 14px;
  line-height: 1.6;
}

.identity-next {
  margin-top: 30px;
  color: #929292;
  font-size: 12px;
}

@media (max-width: 600px) {
  .console { padding: 24px 16px; }

  #output, .prompt {
    font-size: 11px;
    line-height: 1.75;
  }

  .line { min-height: 1.75em; }

  .identity-content { font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<!-- PHASE 01: APPROVED SECURE BOOT -->

<section id="boot" aria-label="Secure boot introduction">
  <div class="console" id="console">
    <div class="console-content">

      <div id="output" aria-hidden="true"></div>

      <div class="prompt" id="prompt">
        <div class="command">
          <span class="command-prefix">system@localhost:~$</span>
          ./launch
        </div>

        <button id="enter" class="enter" type="button">
          <span>Press ENTER to continue</span>
          <span class="cursor" aria-hidden="true"></span>
        </button>
      </div>

    </div>
  </div>
</section>

<!-- PHASE 02: IDENTITY TERMINAL -->

<section id="identity"
         aria-label="Identity terminal"
         aria-hidden="true">

  <div class="console">
    <div class="console-content identity-content">

      <div class="identity-command">
        <span class="command-prefix">
          visitor@console:~$
        </span>
        <span>&nbsp;</span>
        <span id="typed-command"></span>
        <span class="cursor" id="typing-cursor"
              aria-hidden="true"></span>
      </div>

      <div id="identity-result"
           class="identity-result"
           aria-live="polite">

        <div class="identity-name">
          SUGIRVAS SENTHILKUMAR
        </div>

        <div class="identity-tamil" lang="ta">
          சுகிர்வாஸ் செந்தில்குமார்
        </div>

        <div class="identity-next">
          visitor@console:~$ <span class="cursor"
                                  aria-hidden="true"></span>
        </div>

      </div>

    </div>
  </div>
</section>

<!-- EXISTING PORTFOLIO -->

<main id="portfolio">
  <div>
    <h1>SUGIRVAS SENTHILKUMAR</h1>
    <p>SOFTWARE DEVELOPMENT / CYBERSECURITY</p>
  </div>
</main>

<script>
(() => {
  "use strict";

  const boot = document.getElementById("boot");
  const output = document.getElementById("output");
  const consoleView = document.getElementById("console");
  const prompt = document.getElementById("prompt");
  const enter = document.getElementById("enter");
  const portfolio = document.getElementById("portfolio");

  const identity = document.getElementById("identity");
  const typedCommand =
    document.getElementById("typed-command");
  const typingCursor =
    document.getElementById("typing-cursor");
  const identityResult =
    document.getElementById("identity-result");

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  let completed = false;
  let transitioning = false;

  // Visual simulation only, not actual firmware Secure Boot.

  const sequence = [
    ["SECURE BOOT", "bright"],
    ["────────────────────────────────────────", "separator"],
    ["", ""],
    ["> initializing execution environment", ""],
    ["> loading core runtime", ""],
    ["> configuring memory subsystem", ""],
    ["> mounting virtual filesystem", ""],
    ["> resolving module dependencies", ""],
    ["> starting system services", ""],
    ["> initializing terminal interface", ""],
    ["> preparing application runtime", ""],
    ["", ""],
    ["[ OK ] SYSTEM READY", "bright"]
  ];

  const BOOT_DURATION = 5000;
  const STEP_INTERVAL = BOOT_DURATION / sequence.length;

  const delay = ms =>
    new Promise(resolve => setTimeout(resolve, ms));

  function scrollBottom() {
    consoleView.scrollTop = consoleView.scrollHeight;
  }

  function appendLine(message, style) {
    const line = document.createElement("div");
    line.className = "line";

    if (style) line.classList.add(style);

    line.textContent = message || "\u00a0";
    output.appendChild(line);
    scrollBottom();
  }

  async function runBoot() {
    const start = performance.now();

    for (let i = 0; i < sequence.length; i++) {
      const [message, style] = sequence[i];

      const targetTime = start + i * STEP_INTERVAL;
      const remaining = targetTime - performance.now();

      if (remaining > 0) await delay(remaining);

      appendLine(message, style);
    }

    const finalWait =
      start + BOOT_DURATION - performance.now();

    if (finalWait > 0) await delay(finalWait);

    completed = true;
    prompt.classList.add("ready");
    scrollBottom();
    enter.focus({ preventScroll: true });
  }

  async function runIdentity() {
    identity.setAttribute("aria-hidden", "false");
    identity.classList.add("active");
    boot.remove();

    await delay(450);

    const command = "whoami";

    for (const character of command) {
      typedCommand.textContent += character;
      await delay(reducedMotion ? 70 : 125);
    }

    await delay(400);
    typingCursor.style.visibility = "hidden";

    identityResult.style.display = "block";

    // Force the initial opacity state to render.
    void identityResult.offsetWidth;
    identityResult.classList.add("visible");

    await delay(2700);

    portfolio.classList.add("unlocked");
    identity.classList.add("exit");

    await delay(reducedMotion ? 0 : 500);

    identity.remove();
    portfolio.setAttribute("tabindex", "-1");
    portfolio.focus({ preventScroll: true });
  }

  function enterPortfolio() {
    if (!completed || transitioning) return;

    transitioning = true;
    runIdentity();
  }

  enter.addEventListener("click", enterPortfolio);

  document.addEventListener("keydown", event => {
    if (
      event.key === "Enter" &&
      completed &&
      !transitioning
    ) {
      event.preventDefault();
      enterPortfolio();
    }
  });

  runBoot();
})();
</script>

</body>
</html>

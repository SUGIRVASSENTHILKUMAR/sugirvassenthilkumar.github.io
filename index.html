
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Portfolio of Sugirvas Senthilkumar">
<title>Sugirvas Senthilkumar</title>

<script>
  document.documentElement.classList.add("js");
</script>

<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --fg: #f5f5f5;
  --muted: #999;
  --mono: "SFMono-Regular", Menlo, Monaco,
    Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
}

body { font-family: var(--mono); }

#portfolio {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
  font-family: system-ui, sans-serif;
}

#portfolio h1 {
  margin: 0;
  font-size: clamp(2rem, 6vw, 4rem);
  letter-spacing: -.04em;
  line-height: 1.1;
}

#portfolio p {
  color: #aaa;
  font-size: .76rem;
  letter-spacing: .17em;
  line-height: 1.8;
}

.js #portfolio {
  visibility: hidden;
}

.js #portfolio.unlocked {
  visibility: visible;
  animation: reveal .55s ease both;
}

#boot { display: none; }

.js #boot {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  background: #000;
  overflow: hidden;
  transition: opacity .45s ease;
}

.js #boot.exit {
  opacity: 0;
  pointer-events: none;
}

.console {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: clamp(20px, 3vw, 48px);
  font-size: clamp(11px, 1.08vw, 14px);
  line-height: 1.8;
  scrollbar-width: thin;
  scrollbar-color: #333 #000;
}

#output {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

.line { min-height: 1.8em; }
.dim { color: #888; }
.bright { color: #fff; }
.ok { color: #dadada; }

.prompt {
  display: none;
  margin-top: 1.5em;
}

.prompt.ready { display: block; }

.command {
  color: #fff;
  margin-bottom: .7em;
}

.enter {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: white;
  padding: 5px 0;
  background: none;
  border: none;
  cursor: pointer;
  font: inherit;
  text-align: left;
  line-height: 1.7;
}

.enter:hover { color: #ccc; }

.enter:focus-visible {
  outline: 1px solid white;
  outline-offset: 5px;
}

.cursor {
  display: inline-block;
  width: .65em;
  height: 1.05em;
  background: white;
  vertical-align: -.16em;
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

@keyframes reveal {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 600px) {
  .console {
    padding: 20px 15px;
    font-size: 11px;
    line-height: 1.65;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<section id="boot" aria-label="Terminal initialization">
  <div class="console" id="console">
    <div id="output" aria-hidden="true"></div>

    <div class="prompt" id="prompt">
      <div class="command">
        system@localhost:~$ ./launch
      </div>

      <button class="enter" id="enter" type="button">
        <span>Press ENTER to continue</span>
        <span class="cursor" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</section>

<main id="portfolio">
  <div>
    <h1>SUGIRVAS SENTHILKUMAR</h1>
    <p>SOFTWARE DEVELOPMENT / CYBERSECURITY</p>
  </div>
</main>

<script>
(() => {
  "use strict";

  const boot = document.getElementById("boot");
  const output = document.getElementById("output");
  const consoleView = document.getElementById("console");
  const prompt = document.getElementById("prompt");
  const enter = document.getElementById("enter");
  const portfolio = document.getElementById("portfolio");

  const reducedMotion = matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  let completed = false;
  let unlocked = false;
  let elapsed = 0;

  // Simulated terminal output for visual presentation.
  // Not an actual operating-system boot.

  const sequence = [
    ["[    0.000000] Boot sequence initiated", "bright", 330],
    ["[    0.000112] Initializing runtime environment", "", 390],
    ["[    0.000521] Loading core execution context", "", 380],
    ["[    0.001204] Memory allocation complete", "dim", 350],
    ["[    0.002411] Registering subsystem interfaces", "", 420],
    ["[    0.003119] Initializing process scheduler", "", 390],
    ["[    0.004872] Mounting virtual filesystem", "", 400],
    ["[    0.006218] Runtime services available", "dim", 350],
    ["", "", 200],

    [":: Loading system components", "bright", 430],
    ["   [ OK ] Runtime configuration", "ok", 350],
    ["   [ OK ] Resource initialization", "ok", 350],
    ["   [ OK ] Interface dependencies", "ok", 360],
    ["   [ OK ] Execution environment", "ok", 360],
    ["", "", 200],

    [":: Initializing console services", "bright", 430],
    ["   [ OK ] Standard input/output", "ok", 350],
    ["   [ OK ] Terminal session", "ok", 350],
    ["   [ OK ] Display context", "ok", 350],
    ["", "", 200],

    [":: Starting application runtime", "bright", 450],
    ["   [ OK ] Asset registry", "ok", 350],
    ["   [ OK ] Interface renderer", "ok", 350],
    ["   [ OK ] Event handlers", "ok", 350],
    ["   [ OK ] Application environment", "ok", 420],
    ["", "", 200],

    ["[ SYSTEM ] Initialization complete.", "bright", 600],
    ["[ STATUS ] READY", "bright", 450],
    ["", "", 250]
  ];

  const delay = ms =>
    new Promise(resolve => setTimeout(resolve, ms));

  function scrollBottom() {
    consoleView.scrollTop = consoleView.scrollHeight;
  }

  function addLine(message, style) {
    const line = document.createElement("div");
    line.className = "line";

    if (style) line.classList.add(style);

    line.textContent = message || "\u00a0";
    output.appendChild(line);
    scrollBottom();
  }

  async function runBoot() {
    for (const [message, style, duration] of sequence) {
      addLine(message, style);
      elapsed += duration;
      await delay(duration);
    }

    completed = true;
    prompt.classList.add("ready");
    scrollBottom();

    enter.focus({ preventScroll: true });
  }

  function openPortfolio() {
    if (!completed || unlocked) return;

    unlocked = true;

    portfolio.classList.add("unlocked");
    boot.classList.add("exit");

    const fadeDuration = reducedMotion ? 0 : 500;

    setTimeout(() => {
      boot.remove();

      portfolio.setAttribute("tabindex", "-1");
      portfolio.focus({ preventScroll: true });
    }, fadeDuration);
  }

  enter.addEventListener("click", openPortfolio);

  document.addEventListener("keydown", event => {
    if (
      event.key === "Enter" &&
      completed &&
      !unlocked
    ) {
      event.preventDefault();
      openPortfolio();
    }
  });

  runBoot();
})();
</script>

</body>
</html>

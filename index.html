
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Portfolio of Sugirvas Senthilkumar">
  <title>Sugirvas Senthilkumar</title>

  <script>
    document.documentElement.classList.add("js");
  </script>

  <style>
    :root {
      color-scheme: dark;
      --fg: #f2f2f2;
      --mono: "SFMono-Regular", Menlo, Monaco,
              Consolas, "Liberation Mono", monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: var(--fg);
    }

    body {
      font-family: var(--mono);
    }

    /* PORTFOLIO */

    #portfolio {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      font-family: system-ui, sans-serif;
    }

    #portfolio h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: -.04em;
      line-height: 1.1;
    }

    #portfolio p {
      color: #aaa;
      font-size: .76rem;
      letter-spacing: .17em;
      line-height: 1.8;
    }

    .js #portfolio {
      visibility: hidden;
    }

    .js #portfolio.unlocked {
      visibility: visible;
      animation: reveal .45s ease both;
    }

    /* TERMINAL STAGES */

    .terminal-stage {
      display: none;
    }

    .js .terminal-stage {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      background: #000;
      overflow: hidden;
      transition: opacity .4s ease;
    }

    .js .terminal-stage.exit {
      opacity: 0;
      pointer-events: none;
    }

    .js #login-stage {
      z-index: 101;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .js #login-stage.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .console {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: clamp(24px, 4vw, 60px);
      scrollbar-width: thin;
      scrollbar-color: #333 #000;
    }

    .console-content {
      width: 100%;
      max-width: 1100px;
    }

    #output,
    #login-output,
    .prompt {
      font-size: clamp(12px, 1.1vw, 15px);
      line-height: 1.9;
      font-variant-numeric: tabular-nums;
    }

    #login-output {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .line,
    .login-line {
      min-height: 1.9em;
    }

    .bright { color: #fff; }
    .separator { color: #555; }

    .login-prefix,
    .command-prefix {
      color: #999;
    }

    /* INLINE ASCII PROGRESS */

    .boot-task {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 16px;
      width: 100%;
      margin: 2px 0;
    }

    .task-label {
      color: #ededed;
      overflow-wrap: anywhere;
    }

    .task-progress {
      color: #aaa;
      white-space: pre;
      font-size: .92em;
      font-variant-numeric: tabular-nums;
    }

    .task-progress.complete {
      color: #fff;
    }

    /* ENTER PROMPT */

    .prompt {
      display: none;
      margin-top: 24px;
    }

    .prompt.ready {
      display: block;
    }

    .command {
      margin-bottom: 8px;
    }

    .enter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      background: transparent;
      border: 0;
      color: #fff;
      cursor: pointer;
      text-align: left;
      font: inherit;
    }

    .enter:focus-visible {
      outline: 1px solid #fff;
      outline-offset: 5px;
    }

    .cursor {
      display: inline-block;
      width: .65em;
      height: 1.05em;
      background: #fff;
      vertical-align: -.16em;
      margin-left: 3px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes reveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* MOBILE */

    @media (max-width: 650px) {
      .console {
        padding: 24px 16px;
      }

      #output,
      #login-output,
      .prompt {
        font-size: 11px;
        line-height: 1.75;
      }

      .line,
      .login-line {
        min-height: 1.75em;
      }

      .boot-task {
        grid-template-columns: 1fr;
        gap: 0;
        margin-bottom: 6px;
      }

      .task-progress {
        padding-left: 2ch;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- STAGE 01 — SECURE BOOT -->

  <section
    id="boot-stage"
    class="terminal-stage"
    aria-label="Secure boot introduction"
  >
    <div class="console" id="boot-console">
      <div class="console-content">

        <div id="output" aria-hidden="true"></div>

        <div class="prompt" id="prompt">
          <div class="command">
            <span class="command-prefix">system@localhost:~$</span>
            ./launch
          </div>

          <button id="enter" class="enter" type="button">
            Press ENTER to continue
            <span class="cursor" aria-hidden="true"></span>
          </button>
        </div>

      </div>
    </div>
  </section>

  <!-- STAGE 02 — TERMINAL LOGIN -->

  <section
    id="login-stage"
    class="terminal-stage"
    aria-label="Automated terminal login"
    aria-hidden="true"
  >
    <div class="console" id="login-console">
      <div class="console-content">
        <div id="login-output" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <!-- PORTFOLIO -->

  <main id="portfolio">
    <div>
      <h1>SUGIRVAS SENTHILKUMAR</h1>
      <p>SOFTWARE DEVELOPMENT / CYBERSECURITY</p>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const boot = document.getElementById("boot-stage");
      const bootConsole = document.getElementById("boot-console");
      const output = document.getElementById("output");
      const prompt = document.getElementById("prompt");
      const enter = document.getElementById("enter");

      const loginStage = document.getElementById("login-stage");
      const loginConsole = document.getElementById("login-console");
      const loginOutput = document.getElementById("login-output");
      const portfolio = document.getElementById("portfolio");

      const reducedMotion = matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      const BOOT_DURATION = 5000;
      const LOGIN_DURATION = 5000;
      const BAR_WIDTH = 20;

      let bootReady = false;
      let loginStarted = false;

      const delay = ms =>
        new Promise(resolve =>
          setTimeout(resolve, Math.max(0, ms))
        );

      /* STAGE 01 — APPROVED SECURE BOOT */

      // Visual simulation only.
      // No real firmware verification occurs.

      const tasks = [
        "initializing execution environment",
        "loading core runtime",
        "configuring memory subsystem",
        "mounting virtual filesystem",
        "resolving module dependencies",
        "starting system services",
        "initializing terminal interface",
        "preparing application runtime"
      ];

      const taskWeights = [
        1.12, 0.86, 1.08, 0.92,
        1.18, 0.84, 1.02, 0.98
      ];

      const totalWeight = taskWeights.reduce(
        (sum, weight) => sum + weight,
        0
      );

      function scrollBottom(element) {
        element.scrollTop = element.scrollHeight;
      }

      function addLine(text, className = "") {
        const line = document.createElement("div");
        line.className = "line";

        if (className) {
          line.classList.add(className);
        }

        line.textContent = text || "\u00a0";
        output.appendChild(line);
        scrollBottom(bootConsole);
      }

      function createTask(label) {
        const row = document.createElement("div");
        row.className = "boot-task";

        const command = document.createElement("span");
        command.className = "task-label";
        command.textContent = "> " + label;

        const progress = document.createElement("span");
        progress.className = "task-progress";

        row.append(command, progress);
        output.appendChild(row);

        scrollBottom(bootConsole);
        return progress;
      }

      function updateTask(progress, percentage) {
        const n = Math.max(
          0, Math.min(100, Math.round(percentage))
        );

        const filled = Math.round(n / 100 * BAR_WIDTH);

        const bar =
          "#".repeat(filled) +
          "-".repeat(BAR_WIDTH - filled);

        progress.textContent =
          `[${bar}] ${String(n).padStart(3, "0")}%`;

        if (n === 100) {
          progress.classList.add("complete");
        }
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function easeInOutQuad(t) {
        return t < .5
          ? 2 * t * t
          : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      const easingFunctions = [
        easeOutCubic,
        easeInOutQuad,
        easeOutCubic,
        easeInOutQuad,
        easeOutCubic,
        easeInOutQuad,
        easeOutCubic,
        easeInOutQuad
      ];

      async function runBoot() {
        const start = performance.now();

        addLine("SECURE BOOT", "bright");
        addLine(
          "────────────────────────────────────────",
          "separator"
        );
        addLine("");

        let cumulativeWeight = 0;

        for (let i = 0; i < tasks.length; i++) {
          const bar = createTask(tasks[i]);

          const taskStart =
            start +
            BOOT_DURATION *
            (cumulativeWeight / totalWeight);

          cumulativeWeight += taskWeights[i];

          const taskEnd =
            start +
            BOOT_DURATION *
            (cumulativeWeight / totalWeight);

          const duration = taskEnd - taskStart;
          const easing = easingFunctions[i];

          updateTask(bar, 0);

          while (true) {
            const raw = Math.min(
              1,
              Math.max(
                0,
                (performance.now() - taskStart) / duration
              )
            );

            const eased = easing(raw);

            updateTask(
              bar,
              raw >= 1
                ? 100
                : Math.min(99, eased * 100)
            );

            if (raw >= 1) break;

            await delay(32);
          }

          updateTask(bar, 100);
        }

        addLine("");
        addLine("[ OK ] SYSTEM READY", "bright");

        const remaining =
          start + BOOT_DURATION - performance.now();

        if (remaining > 0) {
          await delay(remaining);
        }

        bootReady = true;
        prompt.classList.add("ready");
        scrollBottom(bootConsole);

        enter.focus({ preventScroll: true });
      }

      /* STAGE 02 — APPROVED TERMINAL LOGIN */

      function createTerminalLine(prefix = "") {
        const line = document.createElement("div");
        line.className = "login-line";

        const label = document.createElement("span");
        label.className = "login-prefix";
        label.textContent = prefix;

        const value = document.createElement("span");

        line.append(label, value);
        loginOutput.appendChild(line);

        scrollBottom(loginConsole);
        return value;
      }

      function attachCursor(element) {
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        cursor.setAttribute("aria-hidden", "true");

        element.after(cursor);
        return cursor;
      }

      async function waitUntil(target) {
        const remaining = target - performance.now();

        if (remaining > 0) {
          await delay(remaining);
        }
      }

      async function typeWithin(
        element,
        text,
        start,
        duration
      ) {
        const cursor = attachCursor(element);
        const chars = Array.from(text);

        for (let i = 0; i < chars.length; i++) {
          await waitUntil(
            start +
            ((i + 1) / chars.length) * duration
          );

          element.textContent += chars[i];
          scrollBottom(loginConsole);
        }

        cursor.remove();
      }

      async function runLogin() {
        const start = performance.now();

        loginStage.setAttribute("aria-hidden", "false");
        loginStage.classList.add("active");

        boot.remove();

        // Username: 0.15–1.80 seconds

        await waitUntil(start + 150);

        await typeWithin(
          createTerminalLine("localhost login: "),
          "sugirvassenthilkumar",
          start + 150,
          1650
        );

        // Silent password: 2.00–2.65 seconds

        await waitUntil(start + 2000);

        const password = createTerminalLine("Password: ");
        const passwordCursor = attachCursor(password);

        await waitUntil(start + 2650);
        passwordCursor.remove();

        // Login success and welcome

        await waitUntil(start + 2750);
        createTerminalLine("");
        createTerminalLine("Login successful!");

        await waitUntil(start + 2900);
        createTerminalLine(
          "Welcome, sugirvassenthilkumar!"
        );

        // whoami: 3.40–4.70 seconds

        await waitUntil(start + 3400);
        createTerminalLine("");

        await typeWithin(
          createTerminalLine(
            "sugirvassenthilkumar@localhost:~$ "
          ),
          "whoami",
          start + 3400,
          1300
        );

        await waitUntil(start + LOGIN_DURATION);

        // Directly reveal the portfolio.
        // No Matrix transition.

        portfolio.classList.add("unlocked");
        loginStage.classList.add("exit");

        await delay(reducedMotion ? 0 : 450);

        loginStage.remove();
        portfolio.setAttribute("tabindex", "-1");
        portfolio.focus({ preventScroll: true });
      }

      /* INTERACTION */

      function enterConsole() {
        if (!bootReady || loginStarted) return;

        loginStarted = true;
        runLogin();
      }

      enter.addEventListener("click", enterConsole);

      document.addEventListener("keydown", event => {
        if (
          event.key === "Enter" &&
          bootReady &&
          !loginStarted
        ) {
          event.preventDefault();
          enterConsole();
        }
      });

      runBoot();
    })();
  </script>
</body>
</html>
